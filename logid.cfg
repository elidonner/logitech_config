// Logiops (Linux driver) configuration for Logitech MX Master 3, MX Anywhere 2S, and MX Master 4.
// Includes gestures, smartshift, DPI.
devices: (
{
  name: "MX Master 4";

  smartshift: {
    on: true;
    threshold: 15;
  };

  hiresscroll: {
    hires: false; // turn off for this mouse - it's obnoxious
    invert: false;
    target: false;
  };

  // The MX Master 4 supports up to 8000 DPI, but kept at 1250 to match your old config
  dpi: 1500; // max=8000

  buttons: (
    // Thumb/Gesture button mapped to Media Controls
    {
      cid: 0xc3;
      action = {
        type: "Gestures";
        gestures: (
          {
            direction: "None";
            mode: "OnRelease";
            action = {
              type: "Keypress";
              keys: [ "KEY_PLAY" ];
            };
          },
          {
            direction: "Up";
            mode: "OnInterval";
            interval: 100;
            action = {
              type: "Keypress";
              keys: [ "KEY_VOLUMEUP" ];
            };
          },
          {
            direction: "Down";
            mode: "OnInterval";
            interval: 100;
            action = {
              type: "Keypress";
              keys: [ "KEY_VOLUMEDOWN" ];
            };
          },
          {
            direction: "Right";
            mode: "OnRelease";
            action = {
              type: "Keypress";
              keys: [ "KEY_NEXTSONG" ];
            };
          },
          {
            direction: "Left";
            mode: "OnRelease";
            action = {
              type: "Keypress";
              keys: [ "KEY_PREVIOUSSONG" ];
            };
          }
        );
      }
    },

    // New Haptic Feedback Button
    {
      cid: 0x1a0; // (If this doesn't trigger it, change to 0x1a0)
      action = {
        type: "Keypress";
        keys: [ "KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_Y" ];
      };
    },

    // Top button (Little Button below Scroll)
    {
      cid: 0xc4;
      action = {
        type: "Keypress";
        keys: [ "BTN_MIDDLE" ];
      };
    }

      // Note: Forward and Back buttons omitted to leave them as default
  );
},
